<!DOCTYPE html>

    <title>Tag Del & Ins</title>
</head>
<body>
    <p>Hraga Lama <del>Rp.450.000</del> Harga Baru: <ins>Rp. 350.000</ins></p>

    <br>
    <fieldset>
        <legend><h4>CODE</h4></legend>
        <pre>
    &lt;body&gt;
        &lt;p&gt;Hraga Lama &lt;del&gt;Rp.450.000&lt;/del&gt; Harga Baru: &lt;ins&gt;Rp. 350.000&lt;/ins&gt;&lt;/p&gt;
    &lt;/body&gt;
        </pre>
    </fieldset>
</body>
</html>
