<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress dan Meter elemen</title>
</head>
<body>
    <p><progress  value="50" max="100"></progress></p>
    <p> Tinggi Badan : <meter value="175" max="200"></meter> 175 cm</p>

    <br>
    <fieldset>
        <legend><h4>CODE</h4></legend>
        <pre>
    &lt;body&gt;
        &lt;p&gt;&lt;progress  value="50" max="100"&gt;&lt;/progress&gt;&lt;/p&gt;
        &lt;p&gt; Tinggi Badan : &lt;meter value="175" max="200"&gt;&lt;/meter&gt; 175 cm&lt;/p&gt;
    &lt;/body&gt;
        </pre>
    </fieldset>
</body>
</html>
