<!DOCTYPE html>

<head>

    <title>Tag Em | emphasis</title>
</head>
<body>
    <p>Harap <em>diingat</em> bahwa tugas harus dikumpulkan sebelum pukul 12 siang</p>

    <br>
    <fieldset>
        <legend><h4>CODE</h4></legend>
        <pre>
    &lt;body&gt;
        &lt;p&gt;Harap &lt;em&gt;diingat&lt;/em&gt; bahwa tugas harus dikumpulkan sebelum pukul 12 siang&lt;/p&gt;
    &lt;/body&gt;
        </pre>
    </fieldset>
</body>
</html>
